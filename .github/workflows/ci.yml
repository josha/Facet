name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the paired performance comparison
        required: true
      candidate:
        description: Candidate commit for the paired performance comparison
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Full suite (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for attempt in 1 2 3; do
            if rokit install --no-trust-check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            fi
          done
          exit 1

      - name: Report the toolchain
        run: |
          rojo --version
          lute --version
          luau-lsp --version
          stylua --version

      - name: Full tier
        shell: bash
        run: |
          mkdir -p artifacts/verify
          lute run tools/facet gate --list
          lute run tools/facet gate full 2>&1 | tee artifacts/verify/ci.log

      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify/
            artifacts/phase-4/
            artifacts/bench.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build the distributable model
        run: lute run tools/facet build model

      - name: The model is the library alone
        run: lute run tools/facet check library-purity

  verify:
    name: Verify
    needs: [platform, paired-perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          PERFORMANCE_RESULT: ${{ needs.paired-perf.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ] || [ "$PERFORMANCE_RESULT" != "success" ]; then
            echo "Platform: $PLATFORM_RESULT; paired performance: $PERFORMANCE_RESULT"
            exit 1
          fi

  paired-perf:
    name: Paired performance (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Check out the base beside it
        env:
          BASE_REF: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "A valid base commit is required for the paired performance comparison."
            exit 1
          fi
          if ! git cat-file -e "$BASE_REF^{commit}"; then
            git fetch --no-tags origin "$BASE_REF"
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE_REF"

      - name: Use the same engine reflection data
        run: |
          mkdir -p artifacts/perf-paired-fixtures
          cp "$RUNNER_TEMP/base/tests/fixtures/roblox-reflection.json" artifacts/perf-paired-fixtures/base-original.json
          cp tests/fixtures/roblox-reflection.json artifacts/perf-paired-fixtures/shared.json
          cp artifacts/perf-paired-fixtures/shared.json "$RUNNER_TEMP/base/tests/fixtures/roblox-reflection.json"
          sha256sum artifacts/perf-paired-fixtures/*.json

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchains
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for directory in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            for attempt in 1 2 3; do
              if (cd "$directory" && rokit install --no-trust-check); then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            done
          done

      - name: Use the same measurement code
        run: |
          base="$(cd "$RUNNER_TEMP/base" && pwd)"
          evidence="$GITHUB_WORKSPACE/artifacts/perf-paired-fixtures"
          git -C "$base" diff --exit-code HEAD -- src
          cp "$base/tools/vendor/verify/UPSTREAM.lock" "$evidence/base-verify.lock"
          cp tools/vendor/verify/UPSTREAM.lock "$evidence/shared-verify.lock"
          verify_commit="$(sed -n 's/^  "commit": "\([0-9a-f]*\)",$/\1/p' tools/vendor/verify/UPSTREAM.lock)"
          [[ "$verify_commit" =~ ^[0-9a-f]{40}$ ]]
          lute run tools/facet sync verify --check
          if ! cmp -s tools/vendor/verify/UPSTREAM.lock "$base/tools/vendor/verify/UPSTREAM.lock"; then
            (cd "$base" && lute run "$GITHUB_WORKSPACE/tools/facet" sync verify --bump "$verify_commit")
          fi
          cmp tools/vendor/verify/UPSTREAM.lock "$base/tools/vendor/verify/UPSTREAM.lock"
          (cd "$base" && lute run "$GITHUB_WORKSPACE/tools/facet" sync verify --check)
          git archive HEAD bench tests/lib examples > "$evidence/measurement.tar"
          tar -xf - -C "$base" < "$evidence/measurement.tar"
          git -C "$base" diff --exit-code HEAD -- src
          sha256sum "$evidence/measurement.tar" "$evidence"/*.lock

      - name: Compare the candidate with its base
        run: |
          base_commit="$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)"
          if git diff --quiet "$base_commit" HEAD -- src; then
            echo "Production sources under src, including Compose, are identical to the base. Common measurement setup passed; paired runtime timing is not needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          output=artifacts/perf-paired
          for attempt in 1 2; do
            status=0
            lute run tools/facet perf paired run --out "$output" --rounds 6 --gate --summary "$output-summary.md" base="$RUNNER_TEMP/base" pr="$GITHUB_WORKSPACE" > "$output-report.txt" 2>&1 || status=$?
            cat "$output-report.txt"
            if [ -f "$output-summary.md" ]; then
              cat "$output-summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            echo "CPU calibration was invalid. Retrying once with fresh measurements; preserving $output." | tee -a "$GITHUB_STEP_SUMMARY"
            output=artifacts/perf-paired-calibration-retry
          done

      - name: Save the paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/perf-paired*
          if-no-files-found: warn
          retention-days: 7
