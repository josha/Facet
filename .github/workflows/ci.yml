name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the paired performance comparison
        required: true
      candidate:
        description: Candidate commit for the paired performance comparison
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Full suite (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for attempt in 1 2 3; do
            if rokit install --no-trust-check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            fi
          done
          exit 1

      - name: Report the toolchain
        run: |
          rojo --version
          lute --version
          luau-lsp --version
          stylua --version

      - name: Formatting
        run: stylua --check src tests tools bench examples

      - name: Full tier
        shell: bash
        run: |
          mkdir -p artifacts/verify
          lute run tools/facet gate --list
          lute run tools/facet gate full 2>&1 | tee artifacts/verify/ci.log

      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify/
            artifacts/phase-4/
            artifacts/bench.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build the distributable model
        run: lute run tools/facet build model

      - name: The model is the library alone
        run: lute run tools/facet check library-purity

  verify:
    name: Verify
    needs: [platform, paired-perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          PERFORMANCE_RESULT: ${{ needs.paired-perf.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ] || [ "$PERFORMANCE_RESULT" != "success" ]; then
            echo "Platform: $PLATFORM_RESULT; paired performance: $PERFORMANCE_RESULT"
            exit 1
          fi

  paired-perf:
    name: Paired performance (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Check out the base beside it
        env:
          BASE_REF: ${{ inputs.base || '90dd2dab7db4b895ff8761718148f693c62e038c' }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "A valid base commit is required for the paired performance comparison."
            exit 1
          fi
          if ! git cat-file -e "$BASE_REF^{commit}"; then
            git fetch --no-tags origin "$BASE_REF"
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE_REF"

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchains
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for directory in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            for attempt in 1 2 3; do
              if (cd "$directory" && rokit install --no-trust-check); then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            done
          done

      - name: Compare the candidate with its base
        run: |
          mkdir -p artifacts
          calibration_retries=0
          paired_run() {
            local prefix="$1" rounds="$2" status
            paired_output="$prefix"
            while true; do
              if lute run tools/facet perf paired run --out "$paired_output" --rounds "$rounds" base="$RUNNER_TEMP/base" pr="$GITHUB_WORKSPACE"; then
                return 0
              else
                status=$?
              fi
              if [ "$status" -ne 75 ] || [ "$calibration_retries" -ge 1 ]; then
                return "$status"
              fi
              calibration_retries=$((calibration_retries + 1))
              echo "CPU calibration was invalid. Retrying the complete $rounds-round comparison once; preserving $paired_output." | tee -a "$GITHUB_STEP_SUMMARY"
              paired_output="$prefix-calibration-retry"
            done
          }
          paired_run artifacts/perf-paired 3
          if lute run tools/facet perf paired report "$paired_output" base pr --rounds 3 --gate --summary artifacts/perf-paired-summary.md | tee artifacts/perf-paired-report.txt; then
            cat artifacts/perf-paired-summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            report_codes=("${PIPESTATUS[@]}")
          fi
          if [ "${report_codes[0]}" -ne 1 ] || [ "${report_codes[1]}" -ne 0 ]; then
            echo "The performance report failed outside the statistical gate."
            exit 1
          fi
          echo "Rechecking every scene and microbenchmark with six rounds."
          { echo "First pass found a statistical slowdown. Rechecking the complete paired suite with six rounds."; echo; } >> "$GITHUB_STEP_SUMMARY"
          paired_run artifacts/perf-paired-recheck 6
          status=0
          lute run tools/facet perf paired report "$paired_output" base pr --rounds 6 --gate --summary artifacts/perf-paired-recheck-summary.md | tee artifacts/perf-paired-recheck-report.txt || status=$?
          cat artifacts/perf-paired-recheck-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Save the paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/perf-paired*
          if-no-files-found: warn
          retention-days: 7
