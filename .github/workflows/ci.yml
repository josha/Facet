name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            verify: full
          - os: macos-15
            verify: full --reference-host

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for attempt in 1 2 3; do
            if rokit install --no-trust-check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            fi
          done
          exit 1

      - name: Report the toolchain
        run: |
          rojo --version
          lune --version
          stylua --version
          python3 --version

      - name: Formatting
        run: stylua --check src tests tools bench examples

      - name: Fast tier
        shell: bash
        run: |
          mkdir -p artifacts/verify
          tools/verify.sh fast 2>&1 | tee artifacts/verify/ci-fast.log

      - name: Full tier
        shell: bash
        run: |
          mkdir -p artifacts/verify
          tools/verify.sh ${{ matrix.verify }} --explain 2>&1 | tee artifacts/verify/ci.log

      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify/
            artifacts/phase-4/
            artifacts/bench.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build the distributable model
        run: tools/build_model.sh

      - name: The model is the library alone
        run: python3 tools/check_library_purity.py
