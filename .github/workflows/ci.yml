name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the paired performance comparison
        required: true
      candidate:
        description: Candidate commit for the paired performance comparison
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Verify (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for attempt in 1 2 3; do
            if rokit install --no-trust-check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            fi
          done
          exit 1

      - name: Report the toolchain
        run: |
          rojo --version
          lute --version
          luau-lsp --version
          stylua --version

      - name: Formatting
        run: stylua --check src tests tools bench examples

      - name: Full tier
        shell: bash
        run: |
          mkdir -p artifacts/verify
          lute run tools/facet gate --list
          lute run tools/facet gate full 2>&1 | tee artifacts/verify/ci.log

      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify/
            artifacts/phase-4/
            artifacts/bench.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build the distributable model
        run: lute run tools/facet build model

      - name: The model is the library alone
        run: lute run tools/facet check library-purity

  verify:
    name: Verify
    needs: platform
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Every platform passed
        run: |
          if [ "${{ needs.platform.result }}" != "success" ]; then
            echo "A platform job did not pass: ${{ needs.platform.result }}"
            exit 1
          fi

  paired-perf:
    name: Paired performance
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Check out the base beside it
        run: git worktree add "$RUNNER_TEMP/base" "${{ inputs.base || github.event.pull_request.base.sha }}"

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchains
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for directory in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            for attempt in 1 2 3; do
              if (cd "$directory" && rokit install --no-trust-check); then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            done
          done

      - name: Compare the pull request with its base
        run: |
          mkdir -p artifacts
          lute run tools/facet perf paired run --out artifacts/perf-paired --rounds 3 --skip-bench base="$RUNNER_TEMP/base" pr="$GITHUB_WORKSPACE"
          if lute run tools/facet perf paired report artifacts/perf-paired base pr --gate | tee artifacts/perf-paired-report.txt; then
            exit 0
          fi
          scenes=$(sed -n 's/^paired gate: FAIL - pr is consistently slower in //p' artifacts/perf-paired-report.txt | tr -d ' ')
          echo "Rechecking $scenes with six rounds."
          lute run tools/facet perf paired run --out artifacts/perf-paired-recheck --rounds 6 --skip-bench --scenes "$scenes" base="$RUNNER_TEMP/base" pr="$GITHUB_WORKSPACE"
          lute run tools/facet perf paired report artifacts/perf-paired-recheck base pr --gate | tee artifacts/perf-paired-recheck-report.txt

      - name: Save the paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/perf-paired*
          if-no-files-found: warn
          retention-days: 7
