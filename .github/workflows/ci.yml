name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the paired performance comparison
        required: true
      candidate:
        description: Candidate commit for the paired performance comparison
        required: true
      diagnostic:
        description: Measure A/A noise with three independent samples per platform (base and candidate must be the same commit)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.diagnostic && github.run_id || github.ref }}-${{ inputs.diagnostic || false }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    if: ${{ !inputs.diagnostic }}
    name: Full suite (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for attempt in 1 2 3; do
            if rokit install --no-trust-check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            fi
          done
          exit 1

      - name: Report the toolchain
        run: |
          rojo --version
          lute --version
          luau-lsp --version
          stylua --version

      - name: Prepare all local gate dependencies
        run: lute run tools/facet types prepare

      - name: Full tier shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          set -o pipefail
          mkdir -p artifacts/verify
          lute run tools/facet gate full --shard "$SHARD/$SHARDS" --weights tools/facet/ci-weights.json --record-weights artifacts/verify/ci-weights.json 2>&1 | tee artifacts/verify/ci.log

      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify/
            !artifacts/verify/places/
            artifacts/phase-4/
            artifacts/bench.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save built places for a failed shard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: places-${{ matrix.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify/places/
          if-no-files-found: ignore
          retention-days: 7

      - name: The model is the library alone
        if: matrix.shard == 1
        run: lute run tools/facet check library-purity

  verify:
    name: ${{ inputs.diagnostic && 'A/A diagnostic' || 'Verify' }}
    needs: [platform, paired-perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          PERFORMANCE_RESULT: ${{ needs.paired-perf.result }}
          DIAGNOSTIC: ${{ inputs.diagnostic || false }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ] && [ "$PLATFORM_RESULT" = "skipped" ]; then
            PLATFORM_RESULT=success
          fi
          if [ "$PLATFORM_RESULT" != "success" ] || [ "$PERFORMANCE_RESULT" != "success" ]; then
            echo "Platform: $PLATFORM_RESULT; paired performance: $PERFORMANCE_RESULT"
            exit 1
          fi

  publish-performance:
    name: Publish performance
    needs: [paired-perf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.paired-perf.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-performance
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          rokit install --no-trust-check

      - name: Collect the paired measurements
        uses: actions/download-artifact@v4
        with:
          pattern: paired-performance-shard*
          path: ${{ runner.temp }}/evidence

      - name: Publish to the perf-results branch
        run: |
          set -euo pipefail
          paired=()
          while IFS= read -r directory; do
            retry="${directory}-calibration-retry"
            if [ -d "$retry" ]; then
              paired+=("$retry")
            else
              paired+=("$directory")
            fi
          done < <(find "$RUNNER_TEMP/evidence" -type d -name perf-paired | sort)
          if [ "${#paired[@]}" -eq 0 ]; then
            echo "Paired performance inputs were unchanged; nothing new to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin perf-results 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/results" origin/perf-results
            git -C "$RUNNER_TEMP/results" checkout -B perf-results
          else
            git worktree add --detach "$RUNNER_TEMP/results"
            git -C "$RUNNER_TEMP/results" checkout --orphan perf-results
            git -C "$RUNNER_TEMP/results" rm -rf --quiet .
          fi
          lute run tools/facet perf publish "$RUNNER_TEMP/results" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H%M%SZ)" "${paired[@]}"
          cat "$RUNNER_TEMP/results/README.md" >> "$GITHUB_STEP_SUMMARY"
          git -C "$RUNNER_TEMP/results" add -A
          git -C "$RUNNER_TEMP/results" commit --quiet -m "Performance for $GITHUB_SHA"
          git -C "$RUNNER_TEMP/results" push origin perf-results

  paired-perf:
    name: ${{ inputs.diagnostic && format('Paired performance (shard {0}, sample {1})', matrix.shard, matrix.sample) || format('Paired performance (shard {0})', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4]
        sample: ${{ inputs.diagnostic && fromJSON('[1,2,3]') || fromJSON('[1]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate || github.sha }}

      - name: Check out the base beside it
        env:
          BASE_REF: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "A valid base commit is required for the paired performance comparison."
            exit 1
          fi
          if ! git cat-file -e "$BASE_REF^{commit}"; then
            git fetch --no-tags origin "$BASE_REF"
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE_REF"

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchains
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          for directory in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            for attempt in 1 2 3; do
              if (cd "$directory" && rokit install --no-trust-check); then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Toolchain download failed; retrying in 10 seconds ($attempt/3)."
              sleep 10
            done
          done

      - name: Use the same measurement code
        run: |
          base="$(cd "$RUNNER_TEMP/base" && pwd)"
          evidence="$GITHUB_WORKSPACE/artifacts/perf-paired-fixtures"
          mkdir -p "$evidence"
          git -C "$base" diff --exit-code HEAD -- src
          cp "$base/tools/vendor/verify/UPSTREAM.lock" "$evidence/base-verify.lock"
          cp tools/vendor/verify/UPSTREAM.lock "$evidence/shared-verify.lock"
          verify_commit="$(sed -n 's/^  "commit": "\([0-9a-f]*\)",$/\1/p' tools/vendor/verify/UPSTREAM.lock)"
          [[ "$verify_commit" =~ ^[0-9a-f]{40}$ ]]
          lute run tools/facet sync verify --check
          if ! cmp -s tools/vendor/verify/UPSTREAM.lock "$base/tools/vendor/verify/UPSTREAM.lock"; then
            (cd "$base" && lute run "$GITHUB_WORKSPACE/tools/facet" sync verify --bump "$verify_commit")
          fi
          cmp tools/vendor/verify/UPSTREAM.lock "$base/tools/vendor/verify/UPSTREAM.lock"
          (cd "$base" && lute run "$GITHUB_WORKSPACE/tools/facet" sync verify --check --content)
          measurement=(bench tests examples tools)
          if ! cmp -s src/vendor/compose/UPSTREAM.lock "$base/src/vendor/compose/UPSTREAM.lock"; then
            measurement=(bench/paired_scene.luau bench/paired_workload.luau tests examples tools)
            echo "The Compose pin differs from the base. Each arm runs its own bench scenarios against its own Compose." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git archive HEAD "${measurement[@]}" > "$RUNNER_TEMP/measurement.tar"
          tar -xf - -C "$base" < "$RUNNER_TEMP/measurement.tar"
          git -C "$base" diff --exit-code HEAD -- src
          sha256sum "$RUNNER_TEMP/measurement.tar" "$evidence"/*.lock | tee "$evidence/inputs.sha256"

      - name: Select paired performance inputs
        id: paired-inputs
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic || false }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          lute run tools/facet perf affected "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" > artifacts/perf-paired-inputs.log 2>&1 || status=$?
          cat artifacts/perf-paired-inputs.log
          if [ "$status" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Paired performance inputs are unchanged. Common measurement setup passed." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi

      - name: Validate retained memory measurements
        if: steps.paired-inputs.outputs.run == 'true'
        run: |
          base_commit="$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)"
          if git diff --quiet "$base_commit" HEAD -- bench/paired_scene.luau bench/paired_workload.luau tools/facet/lib/perf_retained.luau tools/engine/retained_memory_proof.luau tools/vendor/verify/src/lute/memory.luau; then
            echo "The retained heap collector, scene adapter and comparison policy are unchanged."
            exit 0
          fi
          lute run tools/facet perf prove-retained-memory --out artifacts/perf-paired-retained-calibration

      - name: Compare the candidate with its base
        if: steps.paired-inputs.outputs.run == 'true'
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic || false }}
        run: |
          base_commit="$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)"
          if [ "$DIAGNOSTIC" = "true" ]; then
            if [ "$base_commit" != "$(git rev-parse HEAD)" ]; then
              echo "A/A diagnostics require the same commit in both arms."
              exit 2
            fi
            echo "A/A diagnostic sample ${{ matrix.sample }} on ${{ matrix.os }}: $base_commit. No retries; a complete slowdown is a false positive, while exit 75 is invalid calibration and other failures are unusable evidence." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          output=artifacts/perf-paired
          for attempt in 1 2; do
            status=0
            lute run tools/facet perf paired run --out "$output" --rounds 6 --shard "${{ matrix.shard }}/4" --gate --summary "$output-summary.md" base="$RUNNER_TEMP/base" pr="$GITHUB_WORKSPACE" > "$output-report.txt" 2>&1 || status=$?
            cat "$output-report.txt"
            if [ -f "$output-summary.md" ]; then
              cat "$output-summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Sample ${{ matrix.sample }} exit status: $status" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DIAGNOSTIC" = "true" ]; then
              exit "$status"
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            echo "CPU calibration was invalid. Retrying once with fresh measurements; preserving $output." | tee -a "$GITHUB_STEP_SUMMARY"
            output=artifacts/perf-paired-calibration-retry
          done

      - name: Save the paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-shard${{ matrix.shard }}-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/perf-paired*
          if-no-files-found: warn
          retention-days: 7
